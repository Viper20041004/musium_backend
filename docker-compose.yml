services:
  postgres:
    image: postgres:16
    container_name: musium_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: musium

    ports:
      - "5432:5432"

    volumes:
      - musium_postgres_data:/var/lib/postgresql/data

volumes:
  musium_postgres_data: